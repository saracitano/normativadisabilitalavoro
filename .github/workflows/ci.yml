name: Verifica archivio e Critic
on:
  push:
    paths:
      - "app/**"
      - "monitor/**"
      - "critic/**"
      - "tests/**"
      - ".github/workflows/ci.yml"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verifica sintassi Python
        run: python3 -m compileall -q app monitor critic tests
      - name: Esegui test
        run: python3 -m unittest discover -s tests -v
      - name: Inizializza database e verifica inventario
        run: |
          python3 app/legislation.py init
          python3 -m app.audit --as-of 2026-11-08 > /tmp/neurolex-audit.json
          python3 -c 'import json; x=json.load(open("/tmp/neurolex-audit.json")); assert x["acts"] >= 60; assert x["articles_indexed"] >= 33'
