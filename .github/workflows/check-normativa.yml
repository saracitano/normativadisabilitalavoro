name: Monitor fonti normative (controllo tecnico)
on:
  schedule:
    - cron: "15 7 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Controlla fonti ufficiali e genera report
        run: python3 monitor/monitor.py
      - name: Convalida test locali
        run: python3 -m unittest discover -s tests
      - name: Registra solo controlli tecnici (non la vigenza giuridica)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add monitor/state.json monitor/latest-report.json
          if ! git diff --cached --quiet; then
            git commit -m "monitor: report tecnico delle fonti normative"
            git push
          fi
